name: Links

# Guards against README/badge rot: broken or misdirected links in the
# Markdown docs fail the check on every push/PR to main.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--config lychee.toml --no-progress ./README.md ./**/*.md'
          fail: true
