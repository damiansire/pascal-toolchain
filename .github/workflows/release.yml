name: Release

# Opens a "Version Packages" PR when changesets are present, and publishes the
# changed packages to npm once that PR is merged.
#
# Requires a repo secret `NPM_TOKEN` — a granular npm access token with
# read/write to the packages and the "bypass 2FA" option enabled.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # Never publish an artifact this pipeline did not verify. Gate the publish
      # on the same checks CI runs: lint, format, build, tests and type-tests.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Type-tests (public API)
        run: npm run test:types

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
